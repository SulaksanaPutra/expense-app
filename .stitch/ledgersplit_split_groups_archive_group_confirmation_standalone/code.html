<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerSplit Split Groups — Archive Group Confirmation (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0066cc',
              focus: '#0071e3',
              dark: '#0052a3',
              light: '#e6f0fa',
            },
            surface: {
              canvas: '#f5f5f7',
              card: '#ffffff',
              pearl: '#fafafc',
              dim: '#d9dadc',
            },
            ink: {
              DEFAULT: '#1d1d1f',
              muted80: '#333333',
              muted48: '#7a7a7a',
            },
            borderLine: {
              hairline: '#e0e0e0',
              divider: '#f0f0f0',
            },
            semantic: {
              success: '#22c55e',
              successBg: '#edfbf2',
              warning: '#f59e0b',
              warningBg: '#fef8ea',
              danger: '#dc2626',
              dangerBg: '#fef2f2',
              info: '#0066cc',
              infoBg: '#f0f7ff',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'Helvetica Neue', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          borderRadius: {
            'card': '18px',
            'pill': '9999px',
          },
          boxShadow: {
            'overlay': '0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] font-sans antialiased text-[#1d1d1f] min-h-screen flex items-center justify-center p-10">

  <!-- Standalone Confirmation Dialog -->
  <div class="w-full max-w-md bg-[#ffffff] rounded-card border border-borderLine-hairline shadow-overlay overflow-hidden">
    <!-- Body -->
    <div class="p-6 space-y-4">
      <!-- Top Row -->
      <div class="flex items-start gap-3.5">
        <!-- Warning / Archive Icon Circle -->
        <div class="w-10 h-10 rounded-full bg-[#fef2f2] border border-[#fecaca] text-[#dc2626] flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="5" x="2" y="3" rx="1"/>
            <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
            <path d="M10 12h4"/>
          </svg>
        </div>

        <!-- Text Block -->
        <div class="flex-1 min-w-0">
          <h2 class="text-[17px] font-semibold text-[#1d1d1f] leading-snug">
            Archive Apartment 4B Shared?
          </h2>
          <p class="text-[13px] text-[#7a7a7a] mt-1.5 leading-relaxed">
            This group will move to Archived (read-only) and stop accepting new expenses. Existing transactions and settlement history remain in your ledger.
          </p>
        </div>
      </div>

      <!-- Summary Sub-Card -->
      <div class="rounded-[14px] bg-[#f5f5f7] border border-[#e0e0e0] p-3.5 flex items-center justify-between text-xs tabular-nums">
        <span class="text-[#7a7a7a] font-medium">Current Net Ledger</span>
        <span class="font-semibold text-[#1d1d1f]">+$580.00 (2 unsettled balances)</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 bg-white border-t border-borderLine-divider flex items-center justify-end gap-3">
      <button type="button" class="h-10 px-5 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-[#1d1d1f] text-xs font-medium hover:bg-[#f5f5f7] transition-colors focus:outline-none">
        Cancel
      </button>
      <button type="button" class="h-10 px-5 rounded-full bg-[#dc2626] hover:bg-red-700 text-white text-xs font-medium transition-colors shadow-none focus:outline-none flex items-center gap-1.5">
        Archive Group
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
