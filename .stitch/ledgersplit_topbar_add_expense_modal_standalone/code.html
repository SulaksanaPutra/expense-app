<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerSplit TopBar — Add Expense Modal (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0066cc',
              focus: '#0071e3',
              dark: '#0052a3',
              light: '#e6f0fa',
            },
            surface: {
              canvas: '#f5f5f7',
              card: '#ffffff',
              pearl: '#fafafc',
              dim: '#d9dadc',
            },
            ink: {
              DEFAULT: '#1d1d1f',
              muted80: '#333333',
              muted48: '#7a7a7a',
            },
            borderLine: {
              hairline: '#e0e0e0',
              divider: '#f0f0f0',
            },
            semantic: {
              success: '#22c55e',
              successBg: '#edfbf2',
              warning: '#f59e0b',
              warningBg: '#fef8ea',
              danger: '#dc2626',
              dangerBg: '#fef2f2',
              info: '#0066cc',
              infoBg: '#f0f7ff',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'Helvetica Neue', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          borderRadius: {
            'card': '18px',
            'pill': '9999px',
          },
          boxShadow: {
            'overlay': '0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] font-sans antialiased text-[#1d1d1f] min-h-screen flex items-center justify-center p-6 md:p-10">

  <!-- STANDALONE MODAL CARD -->
  <div class="w-full max-w-lg bg-[#ffffff] rounded-[20px] border border-borderLine-hairline shadow-overlay overflow-hidden">
    
    <!-- Modal Header -->
    <div class="px-6 py-4 border-b border-[#f0f0f0] flex items-center justify-between">
      <div>
        <h2 class="text-[18px] font-semibold text-[#1d1d1f] leading-snug">Add Expense</h2>
        <p class="text-[13px] text-[#7a7a7a] mt-0.5 leading-normal">Log a shared expense and split it with group members.</p>
      </div>
      <button type="button" aria-label="Close modal" class="w-8 h-8 rounded-full bg-[#f5f5f7] hover:bg-[#e0e0e0] text-[#333333] hover:text-[#1d1d1f] flex items-center justify-center transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Modal Form Body -->
    <div class="p-6 space-y-4 tabular-nums">
      
      <!-- 1. Merchant / Description -->
      <div class="space-y-1.5">
        <label class="block text-[12px] font-medium text-[#333333]">Merchant / Description</label>
        <div class="relative">
          <input 
            type="text" 
            placeholder="e.g., Whole Foods Market" 
            value="Whole Foods Market"
            class="h-11 w-full px-4 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs text-[#1d1d1f] placeholder-[#7a7a7a] focus:outline-none focus:border-brand transition-colors"
          />
        </div>
      </div>

      <!-- 2. Two-Column Row: Amount & Date -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <!-- Amount -->
        <div class="space-y-1.5">
          <label class="block text-[12px] font-medium text-[#333333]">Amount</label>
          <div class="relative flex items-center">
            <span class="absolute left-4 text-[14px] font-medium text-[#7a7a7a]">$</span>
            <input 
              type="text" 
              value="120.00" 
              class="h-11 w-full pl-8 pr-14 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs font-semibold text-[#1d1d1f] focus:outline-none focus:border-brand transition-colors tabular-nums"
            />
            <span class="absolute right-4 text-[11px] font-medium uppercase tracking-wider text-[#7a7a7a] pointer-events-none">USD</span>
          </div>
        </div>

        <!-- Date -->
        <div class="space-y-1.5">
          <label class="block text-[12px] font-medium text-[#333333]">Date</label>
          <div class="relative flex items-center">
            <input 
              type="date" 
              value="2026-11-28" 
              class="h-11 w-full px-4 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs text-[#1d1d1f] focus:outline-none focus:border-brand transition-colors"
            />
          </div>
        </div>
      </div>

      <!-- 3. Two-Column Row: Split Group & Category -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <!-- Split Group -->
        <div class="space-y-1.5">
          <label class="block text-[12px] font-medium text-[#333333]">Split Group</label>
          <div class="relative">
            <select class="h-11 w-full pl-4 pr-10 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs text-[#1d1d1f] focus:outline-none focus:border-brand transition-colors appearance-none cursor-pointer">
              <option selected>Apartment 4B Shared</option>
              <option>Weekend Cabin Crew</option>
              <option>Iceland Roadtrip</option>
              <option>Friday Lunch Club</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-[#7a7a7a]">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
        </div>

        <!-- Category -->
        <div class="space-y-1.5">
          <label class="block text-[12px] font-medium text-[#333333]">Category</label>
          <div class="relative">
            <select class="h-11 w-full pl-4 pr-10 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs text-[#1d1d1f] focus:outline-none focus:border-brand transition-colors appearance-none cursor-pointer">
              <option selected>Groceries</option>
              <option>Housing & Utilities</option>
              <option>Dining & Social</option>
              <option>Travel & Fuel</option>
              <option>Supplies & Misc</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-[#7a7a7a]">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. Paid By -->
      <div class="space-y-1.5">
        <label class="block text-[12px] font-medium text-[#333333]">Paid By</label>
        <div class="relative">
          <select class="h-11 w-full pl-4 pr-10 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs text-[#1d1d1f] focus:outline-none focus:border-brand transition-colors appearance-none cursor-pointer">
            <option selected>Jordan Doe (You)</option>
            <option>Marcus Kim</option>
            <option>Alex Lee</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-[#7a7a7a]">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <!-- 5. Split Method SegmentedControl -->
      <div class="space-y-1.5 pt-1">
        <label class="block text-[12px] font-medium text-[#333333]">Split Method</label>
        <div class="p-1 bg-surface-canvas rounded-pill border border-borderLine-hairline grid grid-cols-4 gap-1">
          <button type="button" class="h-8 rounded-full bg-brand text-xs font-semibold text-white shadow-none transition-all flex items-center justify-center">
            Equal
          </button>
          <button type="button" class="h-8 rounded-full text-[13px] font-medium text-[#7a7a7a] hover:text-[#1d1d1f] transition-colors flex items-center justify-center">
            Percentage
          </button>
          <button type="button" class="h-8 rounded-full text-[13px] font-medium text-[#7a7a7a] hover:text-[#1d1d1f] transition-colors flex items-center justify-center">
            Exact
          </button>
          <button type="button" class="h-8 rounded-full text-[13px] font-medium text-[#7a7a7a] hover:text-[#1d1d1f] transition-colors flex items-center justify-center">
            Shares
          </button>
        </div>
      </div>

      <!-- 6. Split Preview Sub-Card -->
      <div class="rounded-[14px] bg-[#f5f5f7] border border-[#e0e0e0] p-3.5 space-y-2.5">
        <div class="flex items-center justify-between text-[11px] font-semibold uppercase tracking-wider text-[#7a7a7a] pb-1 border-b border-[#f0f0f0]">
          <span>Split Distribution (3 Members)</span>
          <span class="text-[#0066cc]">3-Way Equal (33.3%)</span>
        </div>

        <!-- Jordan Doe -->
        <div class="flex items-center justify-between text-[13px]">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-[#0066cc] text-white text-[10px] font-semibold flex items-center justify-center">JD</span>
            <span class="font-medium text-[#1d1d1f]">Jordan Doe <span class="text-[#7a7a7a] font-normal">(You)</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-semibold text-[#1d1d1f]">$40.00</span>
            <span class="text-[12px] text-[#7a7a7a]">(33.3%)</span>
          </div>
        </div>

        <!-- Marcus Kim -->
        <div class="flex items-center justify-between text-[13px]">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-[#0284c7] text-white text-[10px] font-semibold flex items-center justify-center">MK</span>
            <span class="font-medium text-[#1d1d1f]">Marcus Kim</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-semibold text-[#1d1d1f]">$40.00</span>
            <span class="text-[12px] text-[#7a7a7a]">(33.3%)</span>
          </div>
        </div>

        <!-- Alex Lee -->
        <div class="flex items-center justify-between text-[13px]">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-[#ea580c] text-white text-[10px] font-semibold flex items-center justify-center">AL</span>
            <span class="font-medium text-[#1d1d1f]">Alex Lee</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-semibold text-[#1d1d1f]">$40.00</span>
            <span class="text-[12px] text-[#7a7a7a]">(33.4%)</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="px-6 py-4 bg-white border-t border-borderLine-divider flex items-center justify-end gap-3">
      <button type="button" class="h-10 px-5 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-[13px] font-medium text-[#333333] hover:bg-[#f5f5f7] hover:text-[#1d1d1f] transition-colors">
        Cancel
      </button>
      <button type="button" class="h-10 px-5 rounded-full bg-[#0066cc] hover:bg-[#0071e3] text-[13px] font-medium text-white transition-colors flex items-center gap-1.5 shadow-none">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Expense
      </button>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
