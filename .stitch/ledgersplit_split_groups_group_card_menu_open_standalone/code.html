<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerSplit Split Groups — Group Card Menu Open (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0066cc',
              focus: '#0071e3',
              dark: '#0052a3',
              light: '#e6f0fa',
            },
            surface: {
              canvas: '#f5f5f7',
              card: '#ffffff',
              pearl: '#fafafc',
              dim: '#d9dadc',
            },
            ink: {
              DEFAULT: '#1d1d1f',
              muted80: '#333333',
              muted48: '#7a7a7a',
            },
            borderLine: {
              hairline: '#e0e0e0',
              divider: '#f0f0f0',
            },
            semantic: {
              success: '#22c55e',
              successBg: '#edfbf2',
              warning: '#f59e0b',
              warningBg: '#fef8ea',
              danger: '#dc2626',
              dangerBg: '#fef2f2',
              info: '#0066cc',
              infoBg: '#f0f7ff',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'Helvetica Neue', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          borderRadius: {
            'card': '18px',
            'pill': '9999px',
          },
          boxShadow: {
            'overlay': '0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] font-sans antialiased text-[#1d1d1f] min-h-screen flex items-center justify-center p-10">

  <!-- Centered Single Group Card with Open Dropdown Menu -->
  <div class="w-80 rounded-[18px] bg-[#ffffff] border border-[#0066cc] ring-2 ring-[#0066cc]/15 p-5 shadow-none tabular-nums relative">
    
    <!-- Top Row: Badge + More Button -->
    <div class="flex items-center justify-between mb-3">
      <span class="inline-flex items-center bg-[#f5f5f7] border border-[#e0e0e0] rounded-full px-2.5 py-0.5 text-[11px] font-medium text-[#7a7a7a]">
        Home
      </span>
      <button type="button" class="w-7 h-7 rounded-full bg-[#f5f5f7] text-[#1d1d1f] flex items-center justify-center hover:bg-[#e0e0e0] transition-colors focus:outline-none" aria-label="Group options menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="12" cy="5" r="1"></circle>
          <circle cx="12" cy="19" r="1"></circle>
        </svg>
      </button>
    </div>

    <!-- Title & Subtitle -->
    <div class="mb-4">
      <h3 class="text-[16px] font-semibold text-[#1d1d1f] tracking-tight leading-snug">Apartment 4B Shared</h3>
      <p class="text-[12px] text-[#7a7a7a] mt-0.5">3-Way Equal (33.3%)</p>
    </div>

    <!-- 3-Avatar Stack -->
    <div class="flex items-center -space-x-1.5 mb-5">
      <div class="w-6 h-6 rounded-full bg-[#0066cc] text-white text-[10px] font-semibold flex items-center justify-center ring-2 ring-white">JD</div>
      <div class="w-6 h-6 rounded-full bg-emerald-600 text-white text-[10px] font-semibold flex items-center justify-center ring-2 ring-white">MK</div>
      <div class="w-6 h-6 rounded-full bg-purple-600 text-white text-[10px] font-semibold flex items-center justify-center ring-2 ring-white">AL</div>
    </div>

    <!-- Bottom Metrics -->
    <div class="pt-3 border-t border-[#f0f0f0] flex items-center justify-between text-xs">
      <div>
        <div class="text-[11px] text-ink-muted48">Cycle Spend</div>
        <div class="text-[14px] font-semibold text-[#1d1d1f] mt-0.5">$2,837.70</div>
      </div>
      <div class="text-right">
        <div class="text-[11px] text-ink-muted48">Your Net</div>
        <div class="text-[14px] font-semibold text-[#166534] mt-0.5">+$580.00</div>
      </div>
    </div>

    <!-- Open Floating Dropdown Menu Anchored Below ⋮ Button -->
    <div class="absolute right-4 top-12 w-52 bg-[#ffffff] rounded-2xl border border-borderLine-hairline p-2 shadow-overlay z-40">
      
      <!-- Option 1: Edit Group -->
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 text-xs font-medium text-ink rounded-lg hover:bg-surface-pearl transition-colors group">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-ink-muted48 group-hover:text-ink">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
          <path d="m15 5 4 4"></path>
        </svg>
        <span>Edit Group</span>
      </a>

      <!-- Option 2: Split Rules & Invite -->
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 text-xs font-medium text-ink rounded-lg hover:bg-surface-pearl transition-colors group">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-ink-muted48 group-hover:text-ink">
          <line x1="4" x2="4" y1="21" y2="14"></line>
          <line x1="4" x2="4" y1="10" y2="3"></line>
          <line x1="12" x2="12" y1="21" y2="12"></line>
          <line x1="12" x2="12" y1="8" y2="3"></line>
          <line x1="20" x2="20" y1="21" y2="16"></line>
          <line x1="20" x2="20" y1="12" y2="3"></line>
          <line x1="1" x2="7" y1="14" y2="14"></line>
          <line x1="9" x2="15" y1="8" y2="8"></line>
          <line x1="17" x2="23" y1="16" y2="16"></line>
        </svg>
        <span>Split Rules &amp; Invite</span>
      </a>

      <!-- Option 3: Audit Log -->
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 text-xs font-medium text-ink rounded-lg hover:bg-surface-pearl transition-colors group">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-ink-muted48 group-hover:text-ink">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Audit Log</span>
      </a>

      <!-- Divider -->
      <div class="border-t border-[#f0f0f0] my-1"></div>

      <!-- Option 4: Archive Group -->
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 text-xs font-medium text-semantic-danger rounded-lg hover:bg-red-50 transition-colors group">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-semantic-danger">
          <rect width="20" height="5" x="2" y="3" rx="1"></rect>
          <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"></path>
          <path d="M10 12h4"></path>
        </svg>
        <span>Archive Group</span>
      </a>

    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
