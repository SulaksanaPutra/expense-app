<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerSplit Settings — Settlement Handle Menu Open (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0066cc',
              focus: '#0071e3',
              dark: '#0052a3',
              light: '#e6f0fa',
            },
            surface: {
              canvas: '#f5f5f7',
              card: '#ffffff',
              pearl: '#fafafc',
              dim: '#d9dadc',
            },
            ink: {
              DEFAULT: '#1d1d1f',
              muted80: '#333333',
              muted48: '#7a7a7a',
            },
            borderLine: {
              hairline: '#e0e0e0',
              divider: '#f0f0f0',
            },
            semantic: {
              success: '#22c55e',
              successBg: '#edfbf2',
              warning: '#f59e0b',
              warningBg: '#fef8ea',
              danger: '#dc2626',
              dangerBg: '#fef2f2',
              info: '#0066cc',
              infoBg: '#f0f7ff',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'Helvetica Neue', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          borderRadius: {
            'card': '18px',
            'pill': '9999px',
          },
          boxShadow: {
            'overlay': '0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] font-sans antialiased text-[#1d1d1f] min-h-screen flex items-center justify-center p-10">

  <!-- Outer Card Container -->
  <div class="w-full max-w-md bg-[#ffffff] rounded-[18px] border border-[#e0e0e0] p-4 shadow-none relative">
    
    <!-- Settlement Handle Row Card -->
    <div class="w-full bg-surface-pearl border border-borderLine-hairline rounded-[14px] p-4 flex items-center justify-between gap-3 relative">
      
      <!-- Left: Logo & Info -->
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-[#f3e8ff] text-[#6d28d9] flex items-center justify-center shrink-0">
          <!-- Zap / Bolt SVG -->
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-sm font-semibold text-[#1d1d1f] leading-snug">Zelle</span>
          <span class="text-[13px] tabular-nums text-[#333333] leading-snug">+1 (415) 890-3412</span>
        </div>
      </div>

      <!-- Right: Active 3-dot trigger button -->
      <button type="button" aria-label="Settlement handle actions" class="w-8 h-8 rounded-full bg-surface-canvas text-[#1d1d1f] flex items-center justify-center transition-colors hover:bg-[#e0e0e0]">
        <!-- More-Vertical SVG -->
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="12" cy="5" r="1"></circle>
          <circle cx="12" cy="19" r="1"></circle>
        </svg>
      </button>

      <!-- Open Floating Dropdown Menu -->
      <div class="absolute right-4 top-16 w-48 bg-[#ffffff] rounded-2xl border border-borderLine-hairline p-2 shadow-overlay z-40">
        <div class="flex flex-col gap-0.5">
          <!-- Item 1: Set as Default -->
          <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-ink rounded-lg hover:bg-surface-pearl transition-colors text-left font-medium">
            <!-- Check Circle SVG -->
            <svg class="w-3.5 h-3.5 text-ink-muted48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Set as Default</span>
          </button>

          <!-- Item 2: Edit Handle -->
          <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-ink rounded-lg hover:bg-surface-pearl transition-colors text-left font-medium">
            <!-- Pencil SVG -->
            <svg class="w-3.5 h-3.5 text-ink-muted48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
            <span>Edit Handle</span>
          </button>

          <!-- Divider -->
          <div class="border-t border-[#f0f0f0] my-1"></div>

          <!-- Item 3: Delete (Danger) -->
          <button type="button" class="w-full flex items-center gap-2.5 px-3 py-2 text-xs text-semantic-danger rounded-lg hover:bg-red-50 transition-colors text-left font-medium">
            <!-- Trash SVG -->
            <svg class="w-3.5 h-3.5 text-semantic-danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            <span>Delete</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
