<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerSplit Settings — Add & Edit Settlement Handle Modal (Standalone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0066cc',
              focus: '#0071e3',
              dark: '#0052a3',
              light: '#e6f0fa',
            },
            surface: {
              canvas: '#f5f5f7',
              card: '#ffffff',
              pearl: '#fafafc',
              dim: '#d9dadc',
            },
            ink: {
              DEFAULT: '#1d1d1f',
              muted80: '#333333',
              muted48: '#7a7a7a',
            },
            borderLine: {
              hairline: '#e0e0e0',
              divider: '#f0f0f0',
            },
            semantic: {
              success: '#22c55e',
              successBg: '#edfbf2',
              warning: '#f59e0b',
              warningBg: '#fef8ea',
              danger: '#dc2626',
              dangerBg: '#fef2f2',
              info: '#0066cc',
              infoBg: '#f0f7ff',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'Helvetica Neue', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          borderRadius: {
            'card': '18px',
            'pill': '9999px',
          },
          boxShadow: {
            'overlay': '0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f5f5f7;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[#f5f5f7] font-sans antialiased text-[#1d1d1f] min-h-screen flex items-center justify-center p-10">

  <!-- Standalone Modal Card (No dark backdrop) -->
  <div class="w-full max-w-md bg-[#ffffff] rounded-[20px] border border-borderLine-hairline shadow-overlay overflow-hidden">
    
    <!-- Modal Header -->
    <div class="px-6 py-4 border-b border-[#f0f0f0] flex items-center justify-between">
      <div>
        <h2 class="text-[18px] font-semibold text-[#1d1d1f] tracking-tight">Edit Settlement Handle</h2>
        <p class="text-[13px] text-[#7a7a7a] mt-0.5">Add or update a payout handle shown on Settle Up links.</p>
      </div>
      <button type="button" class="w-8 h-8 rounded-full bg-[#f5f5f7] text-[#333333] hover:bg-[#e0e0e0] flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Modal Form Body -->
    <div class="p-6 space-y-4">
      <!-- Field 1: Provider -->
      <div>
        <label class="block text-[13px] font-medium text-[#1d1d1f] mb-1.5">Provider</label>
        <div class="relative">
          <select class="h-11 w-full px-4 pr-10 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs text-[#1d1d1f] focus:outline-none focus:border-brand transition appearance-none cursor-pointer">
            <option value="Venmo" selected>Venmo</option>
            <option value="Zelle">Zelle</option>
            <option value="Cash App">Cash App</option>
            <option value="PayPal">PayPal</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-[#7a7a7a]">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <!-- Field 2: Handle / Account Tag -->
      <div>
        <label class="block text-[13px] font-medium text-[#1d1d1f] mb-1.5">Handle / Account Tag</label>
        <input 
          type="text" 
          value="@jordan-davis" 
          class="h-11 w-full px-4 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs text-[#1d1d1f] placeholder-[#7a7a7a] focus:outline-none focus:border-brand transition"
        />
        <p class="text-[12px] text-[#7a7a7a] mt-1.5 px-1">Username, phone number, or email peers send to.</p>
      </div>

      <!-- Field 3: Display Note (Optional) -->
      <div>
        <label class="block text-[13px] font-medium text-[#1d1d1f] mb-1.5">
          Display Note <span class="text-[#7a7a7a] font-normal">(Optional)</span>
        </label>
        <input 
          type="text" 
          placeholder="e.g., Personal Venmo" 
          class="h-11 w-full px-4 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-xs text-[#1d1d1f] placeholder-[#7a7a7a] focus:outline-none focus:border-brand transition"
        />
      </div>

      <!-- Default Toggle Sub-Card -->
      <div class="bg-[#f5f5f7] border border-[#e0e0e0] rounded-[14px] p-3.5 flex items-center justify-between gap-3">
        <div>
          <div class="text-[13px] font-medium text-[#1d1d1f]">Set as default handle</div>
          <div class="text-[12px] text-[#7a7a7a] mt-0.5">Pre-selected when peers settle up with you.</div>
        </div>
        <!-- Switch (Active / ON) -->
        <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
          <input type="checkbox" checked class="sr-only peer">
          <div class="w-11 h-6 bg-[#d2d2d7] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-semantic-success after:shadow-sm"></div>
        </label>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="px-6 py-4 bg-white border-t border-borderLine-divider flex items-center justify-between gap-3">
      <!-- Left: Delete Button -->
      <button 
        type="button" 
        class="h-10 px-4 rounded-full bg-[#fef2f2] border border-[#fecaca] text-[#dc2626] hover:bg-[#fef2f2] text-xs font-semibold flex items-center gap-1.5 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
        Delete
      </button>

      <!-- Right: Action Buttons -->
      <div class="flex items-center gap-2.5">
        <button 
          type="button" 
          class="h-10 px-4 rounded-full bg-[#ffffff] border border-[#e0e0e0] text-[#1d1d1f] hover:bg-[#f5f5f7] text-xs font-medium transition-colors"
        >
          Cancel
        </button>
        <button 
          type="button" 
          class="h-10 px-5 rounded-full bg-[#0066cc] hover:bg-[#0071e3] text-white text-xs font-medium transition-colors shadow-none"
        >
          Save Handle
        </button>
      </div>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
